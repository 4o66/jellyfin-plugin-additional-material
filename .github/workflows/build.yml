name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  script-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  # The plugin's planner (C#) and the helper script (Python) must make the same decisions.
  planner-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build planner-compare
        run: dotnet publish tools/planner-compare -c Release -o pc --nologo
      - name: Rule self-tests (C#)
        run: dotnet pc/PlannerCompare.dll --self-test --rules tools/rules
      - name: Plan the fixture library with both, and compare
        run: |
          python tools/planner-compare/fixtures.py "$RUNNER_TEMP/lib"
          # The plugin has no 7z program, so it cannot look inside .7z/.rar archives; run the script
          # without one too (the runner has 7z), so both treat them the same way.
          mkdir -p "$RUNNER_TEMP/no7z" && ln -sf "$(command -v python)" "$RUNNER_TEMP/no7z/python"
          PATH="$RUNNER_TEMP/no7z" python tools/make_additional_material.py "$RUNNER_TEMP/lib" --json py.json -q
          dotnet pc/PlannerCompare.dll "$RUNNER_TEMP/lib" --rules tools/rules --json cs.json
          python tools/planner-compare/compare.py py.json cs.json

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet publish src/Jellyfin.Plugin.AdditionalMaterial -c Release -o out --nologo
      - name: Package
        run: |
          version=$(grep -oP '(?<=<AssemblyVersion>)[^<]+' src/Jellyfin.Plugin.AdditionalMaterial/Jellyfin.Plugin.AdditionalMaterial.csproj)
          mkdir -p dist
          (cd out && zip -j "../dist/additional-material_${version}.zip" Jellyfin.Plugin.AdditionalMaterial.dll Tomlyn.dll)
          md5sum dist/*.zip | tee dist/checksums.md5
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/

  integration:
    needs: plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: dist
      - name: Unpack
        run: mkdir -p out && unzip -o dist/*.zip -d out
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full jq
      - name: Integration test (throwaway Jellyfin 12.1)
        run: bash tests/integration.sh out
      - name: Clean up
        if: always()
        run: bash tests/integration.sh --cleanup

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [script-tests, plugin, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
